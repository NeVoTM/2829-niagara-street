<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Title Block -->
  <rect x="550" y="450" width="240" height="140" stroke="black" stroke-width="2" fill="none"/>
  <text x="560" y="470" font-family="Arial" font-size="14" font-weight="bold">PATENT DRAWING</text>
  <text x="560" y="490" font-family="Arial" font-size="12">Drawing: [DRAWING_NAME]</text>
  <text x="560" y="510" font-family="Arial" font-size="12">Scale: [SCALE]</text>
  <text x="560" y="530" font-family="Arial" font-size="12">Date: [DATE]</text>
  <text x="560" y="550" font-family="Arial" font-size="12">Sheet: [SHEET] of [TOTAL]</text>
  <text x="560" y="570" font-family="Arial" font-size="12">Inventor: [INVENTOR_NAME]</text>
  
  <!-- Drawing Area -->
  <rect x="50" y="50" width="480" height="380" stroke="black" stroke-width="1" fill="none"/>
  
  <!-- Grid for alignment (remove in final) -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ccc" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="50" y="50" width="480" height="380" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Example dimension line -->
  <g id="dimension_template" style="display:none">
    <line x1="100" y1="100" x2="200" y2="100" stroke="black" stroke-width="1"/>
    <line x1="95" y1="95" x2="105" y2="105" stroke="black" stroke-width="1"/>
    <line x1="195" y1="95" x2="205" y2="105" stroke="black" stroke-width="1"/>
    <text x="150" y="95" font-family="Arial" font-size="10" text-anchor="middle">[DIMENSION]</text>
  </g>
  
  <!-- Reference numbers template -->
  <g id="reference_numbers">
    <!-- Add reference numbers like: -->
    <!-- <circle cx="150" cy="150" r="8" stroke="black" stroke-width="1" fill="white"/>
         <text x="150" y="155" font-family="Arial" font-size="10" text-anchor="middle">10</text> -->
  </g>
  
  <!-- Add your drawing elements here -->
  
</svg>
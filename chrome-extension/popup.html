<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #007AFF, #0056CC);
            color: white;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .dropdown-button {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .dropdown-button:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }
        
        .dropdown-button:active {
            transform: translateY(0px);
        }
        
        .hotkey {
            float: right;
            font-size: 12px;
            opacity: 0.8;
            font-weight: 400;
        }
        
        .status {
            margin-top: 15px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>🚀 Warp AI Dropdowns</h2>
    </div>
    
    <button class="dropdown-button" onclick="launchDropdown('debug')">
        Debug Issues <span class="hotkey">Alt+Shift+1</span>
    </button>
    
    <button class="dropdown-button" onclick="launchDropdown('commands')">
        Commands Browser <span class="hotkey">Alt+Shift+2</span>
    </button>
    
    <button class="dropdown-button" onclick="launchDropdown('files')">
        Files Browser <span class="hotkey">Alt+Shift+3</span>
    </button>
    
    <button class="dropdown-button" onclick="launchDropdown('references')">
        Reference Selector <span class="hotkey">Alt+Shift+4</span>
    </button>
    
    <div class="status" id="status">
        Click buttons above or use hotkeys
    </div>

    <script src="popup.js"></script>
</body>
</html>
